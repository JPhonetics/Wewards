name: wewards

services:
  db:
    image: postgres:15
    container_name: wewards_db_container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    user: "${UID}:${GID}"
    build: ./server
    image: wewards_backend_image
    container_name: wewards_backend_container
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    # command: sh -c "gunicorn wewards.wsgi --bind 0.0.0.0:8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      - db

  nginx:
    build: ./client
    image: wewards_frontend_image
    container_name: wewards_nginx_container
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
    - backend

volumes:
  pgdata: