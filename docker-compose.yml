name: wewards

services:
  db:
    image: postgres:15
    container_name: wewards_db_container
    env_file:
      - ./server/.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    # user: "${UID}:${GID}"
    build: ./server
    image: wewards_backend_image
    container_name: wewards_backend_container
    env_file:
      - ./server/.env
    # command: sh -c "python manage.py runserver 0.0.0.0:8000"
    command: sh -c "gunicorn config.wsgi --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      - db

  nginx:
    build:
      context: ./client
      args:
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    image: wewards_frontend_image
    container_name: wewards_nginx_container
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
    - backend

volumes:
  pgdata: